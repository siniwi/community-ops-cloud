<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Feedback tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tomorrow:wght@500;600;700&family=Play:wght@400;700&display=swap">
<style>
/* Same visual language as the team Inbox and Trends pages: night-blue tonal surfaces, one teal accent, Tomorrow for headings and single figures, Play for everything else. Dark only. */
:root{--teal:#47d8d7;--teal-ink:#5fe1e0;--teal-wash:#0b2a33;--on-teal:#083d3d;--up:#5fd197;--down:#ff8f7e;
  --ground:#070b15;--tray:#0a0f1d;--surface:#0d1322;--surface-2:#111a2d;--fill:#172036;--fill-hover:#1f2a45;--line:#26324f;--line-strong:#5a6a94;--ink:#eef2fb;--muted:#9ba6c2;
  --font-sans:"Play",ui-sans-serif,system-ui,sans-serif;--font-display:"Tomorrow",ui-sans-serif,system-ui,sans-serif;
  --shadow-control:0 1px 2px rgb(0 0 0/.4),0 2px 6px -2px rgb(0 0 0/.6),inset 0 0 0 1px var(--line-strong);--ease:cubic-bezier(.23,1,.32,1);color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--ground)}
body{background:var(--ground);color:var(--ink);font:15px/1.4 var(--font-sans);margin:0;padding:28px 24px 48px;min-height:100%;caret-color:var(--teal);-webkit-font-smoothing:antialiased;scrollbar-color:var(--fill-hover) transparent}
::selection{background:rgb(71 216 215/.32)}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.ic{flex:none;display:inline-block;vertical-align:middle}
.wrap{max-width:1000px;margin:0 auto;display:grid;gap:22px}
.lbl{font-size:13px;font-weight:700;color:var(--muted)}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 16px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:44px;height:44px;border-radius:13px;background:var(--teal);color:var(--on-teal);display:grid;place-items:center;flex:none}
h1{font:700 18px/1.2 var(--font-display);margin:0}
h2{font:700 17px/1.2 var(--font-display);margin:0}
.bsub{font-size:13px;color:var(--muted)}
.hright{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:4px 6px}
.qlink{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 8px;color:var(--teal-ink);font-weight:700;font-size:14px;text-decoration:none;background:none;border:0;cursor:pointer;font-family:var(--font-sans)}
.qlink.here{color:var(--ink);cursor:default}
.mode{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);padding:0 8px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--line-strong);flex:none}
.pulse.ok{background:var(--teal)}
.pulse.warn{background:var(--down)}
.hud{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.cell{background:var(--surface-2);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0;border:0;color:inherit;text-align:left;font:inherit;cursor:pointer;transition:background-color 150ms ease}
.cell[aria-pressed="true"]{box-shadow:inset 0 0 0 1px var(--teal-ink)}
.big{font:700 26px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.sub{font-size:13px;color:var(--muted)}
.cyan{color:var(--teal-ink)}.pos{color:var(--up)}.neg{color:var(--down)}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border-radius:16px;padding:12px 16px;color:var(--muted);font-size:14px}
.banner b{color:var(--ink)}
.banner .ic{color:var(--down);margin-top:2px}
.navrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--tray);border-radius:15px;padding:4px;min-width:460px}
.tab{height:44px;padding:0 14px;border:0;border-radius:11px;background:transparent;color:var(--muted);font:14px var(--font-sans);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:background-color 380ms var(--ease),color 150ms ease,scale 150ms var(--ease)}
.tab[aria-selected="true"]{background:var(--fill-hover);box-shadow:var(--shadow-control);color:var(--ink);font-weight:700}
.tab:active{scale:.97}
.tab .n{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}
.tab[aria-selected="true"] .n{color:var(--teal-ink)}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border:0;border-radius:12px;background:var(--fill);color:var(--ink);font:700 14px var(--font-sans);cursor:pointer;text-decoration:none;white-space:nowrap;transition:background-color 150ms ease,scale 150ms var(--ease)}
.btn .ic{color:var(--teal-ink)}
.btn:active{scale:.97}
.btn.sm{height:36px;padding:0 12px;border-radius:10px}
.btn.ghost{background:transparent;color:var(--teal-ink);padding:0 8px}
.btn.primary{background:var(--teal);color:var(--on-teal)}
.btn.primary .ic{color:var(--on-teal)}
.btn:disabled{opacity:.6;cursor:default}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:12px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.search .ic{color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:15px var(--font-sans);outline:0}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{height:32px;padding:0 12px;border-radius:9px;border:0;background:var(--fill);color:var(--muted);font:700 14px var(--font-sans);cursor:pointer;transition:background-color 150ms ease;display:inline-flex;align-items:center;gap:6px}
.chipbtn[aria-pressed="true"]{background:var(--fill-hover);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-strong)}
.chipbtn .n{font-variant-numeric:tabular-nums;color:var(--muted)}
.seg{display:inline-flex;background:var(--tray);border-radius:12px;padding:3px;gap:2px}
.seg .chipbtn{height:34px;background:transparent}
.seg .chipbtn[aria-pressed="true"]{background:var(--fill-hover)}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0;scroll-margin-top:20px}
.card.k-Bug{box-shadow:inset 4px 0 0 var(--down)}
.card.closed{opacity:.62}
.card.hl{border-color:var(--teal-ink)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:13px;font-weight:700;background:var(--fill);color:var(--muted);white-space:nowrap;text-decoration:none}
.tag.k-Bug{background:color-mix(in srgb,var(--down) 16%,var(--surface));color:var(--down)}
.tag.k-Feature{background:var(--teal-wash);color:var(--teal-ink)}
.tag.s-New{background:var(--teal-wash);color:var(--teal-ink)}
.tag.s-Needs{color:var(--down);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--down) 45%,transparent)}
.tag.s-Ticketed,.tag.s-In{color:var(--ink)}
.tag.s-Fixed{color:var(--up)}
.tag.jira{color:var(--ink);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-strong)}
a.tag.jira:hover{background:var(--fill-hover)}
.num{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.when{color:var(--muted);font-size:13px;margin-left:auto;font-variant-numeric:tabular-nums}
.title{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.title a{color:var(--ink);text-decoration:none}
.title a .ic{color:var(--muted);margin-left:4px}
.ptxt{color:var(--muted);font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.notes{background:var(--surface-2);border-radius:12px;padding:10px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.notes .lbl{display:block;margin-bottom:2px}
.links{display:flex;flex-wrap:wrap;gap:6px}
.shots{display:flex;flex-wrap:wrap;gap:8px}
.shots a{display:block;width:120px;height:76px;border-radius:9px;overflow:hidden;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.shots img{width:100%;height:100%;object-fit:cover;display:block}
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:13px;color:var(--muted)}
.foot .acts{margin-left:auto}
.log{background:var(--surface-2);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--muted);display:grid;gap:4px}
.log b{color:var(--ink)}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px;color:var(--muted);text-align:center}
/* add / edit sheet */
dialog{border:0;padding:0;background:transparent;color:var(--ink);max-width:640px;width:calc(100% - 32px)}
dialog::backdrop{background:rgb(3 6 12/.72)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;display:grid;gap:14px;max-height:calc(100vh - 48px);overflow:auto}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.field{display:grid;gap:6px}
.field input,.field textarea{width:100%;min-height:44px;border-radius:12px;border:0;box-shadow:inset 0 0 0 1px var(--line-strong);background:var(--surface-2);color:var(--ink);padding:10px 14px;font:15px var(--font-sans)}
.field textarea{min-height:88px;resize:vertical;line-height:1.4}
.field .hint{font-size:13px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--down);font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;translate:-50% 0;background:var(--fill-hover);box-shadow:var(--shadow-control);border-radius:12px;padding:10px 16px;font-size:14px;z-index:5}
[hidden]{display:none!important}
@media (hover:hover) and (pointer:fine){
  .tab:not([aria-selected="true"]):hover{color:var(--ink)}
  .btn:not(:disabled):not(.ghost):not(.primary):hover,.chipbtn:hover,.cell:hover{background:var(--fill-hover)}
  .btn.primary:hover{background:var(--teal-ink)}
  .btn.ghost:hover,.qlink:not(.here):hover{text-decoration:underline}
  .title a:hover{color:var(--teal-ink)}
}
@media (max-width:860px){
  body{padding:16px 16px 40px}.wrap{gap:16px}
  .hud{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tabs{min-width:0;width:100%}.tab{padding:0 6px}
  .big{font-size:24px}
  .row2{grid-template-columns:1fr}
  .hright{justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="mark"><span data-ic="wrench" data-s="22"></span></div><div><h1>Feedback tracker</h1><div class="bsub">Player bugs and feedback, with their Jira tickets</div></div></div>
    <div class="hright">
      <span class="mode"><span class="pulse" id="mode-dot"></span><span id="mode">Loading…</span></span>
      <a class="qlink" href="/trends/">Trends</a><a class="qlink" href="/inbox/">Inbox</a><span class="qlink here" aria-current="page">Tracker</span>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <div class="hud">
    <button class="cell" data-q="bugs"><span class="lbl">Open bugs</span><span class="big neg" id="h-bugs">–</span><span class="sub">not fixed or closed</span></button>
    <button class="cell" data-q="noticket"><span class="lbl">No ticket yet</span><span class="big cyan" id="h-noticket">–</span><span class="sub">open, no Jira link</span></button>
    <button class="cell" data-q="ticketed"><span class="lbl">Ticketed, open</span><span class="big" id="h-ticketed">–</span><span class="sub">has a Jira link</span></button>
    <button class="cell" data-q="fixed"><span class="lbl">Fixed, 30 days</span><span class="big pos" id="h-fixed">–</span><span class="sub">marked fixed lately</span></button>
  </div>

  <div class="navrow">
    <div class="tabs" role="tablist" id="kinds"></div>
    <div class="acts">
      <button class="btn ghost" id="csv"><span data-ic="download-simple"></span>CSV</button>
      <button class="btn primary" id="add"><span data-ic="plus"></span>Add entry</button>
    </div>
  </div>

  <div class="tools">
    <label class="search"><span data-ic="magnifying-glass"></span><input id="q" type="search" placeholder="Search titles, notes, Jira keys" aria-label="Search"></label>
    <div class="seg" id="sort" role="group" aria-label="Sort">
      <button class="chipbtn" data-sort="posted" aria-pressed="true">Newest</button>
      <button class="chipbtn" data-sort="reports" aria-pressed="false">Most reports</button>
      <button class="chipbtn" data-sort="changed" aria-pressed="false">Recently changed</button>
    </div>
  </div>
  <div class="filters" id="statuses" role="group" aria-label="Status"></div>

  <div class="list" id="list"><div class="empty">Loading the tracker…</div></div>
</div>

<dialog id="sheet">
  <form class="sheet" id="form" method="dialog">
    <div class="sheethead"><h2 id="sheet-title">Add entry</h2><button class="btn ghost" type="button" id="close" aria-label="Close"><span data-ic="x"></span></button></div>
    <div class="field"><span class="lbl">Type</span><div class="seg" id="f-kind" role="group"></div></div>
    <label class="field"><span class="lbl">Title</span><input name="title" required maxlength="300" placeholder="Short, e.g. Crash when opening the playlist editor"></label>
    <div class="row2">
      <label class="field"><span class="lbl">Link to the feedback</span><input name="url" type="url" placeholder="https://"></label>
      <label class="field"><span class="lbl">Date posted</span><input name="posted_at" type="date"></label>
    </div>
    <div class="field"><span class="lbl">Source</span><div class="filters" id="f-source" role="group"></div></div>
    <div class="field"><span class="lbl">Status</span><div class="filters" id="f-status" role="group"></div></div>
    <label class="field"><span class="lbl">Jira ticket link</span><input name="jira_url" type="url" placeholder="https://….atlassian.net/browse/AL-123"></label>
    <label class="field"><span class="lbl">What players report</span><textarea name="summary" maxlength="8000"></textarea></label>
    <label class="field"><span class="lbl">Team notes</span><textarea name="notes" maxlength="8000"></textarea></label>
    <label class="field"><span class="lbl">More reports of the same thing</span><textarea name="links" placeholder="One link per line"></textarea><span class="hint">Each extra link counts as one more report.</span></label>
    <label class="field"><span class="lbl">Screenshot links</span><textarea name="shots" placeholder="One image link per line"></textarea></label>
    <label class="field"><span class="lbl">Your name</span><input name="by" maxlength="80" placeholder="Shown on the change history" autocomplete="name"></label>
    <div class="err" id="f-err" role="alert" hidden></div>
    <div class="acts"><button class="btn primary" type="submit" id="save"><span data-ic="check"></span>Save</button><button class="btn" type="button" id="cancel">Cancel</button></div>
  </form>
</dialog>
<div class="toast" id="toast" role="status" hidden></div>

12V16a12,12,0,0,1,24,0V28h12a12,12,0,0,1,0,24H188V64a12,12,0,0,1-24,0V52H152A12,12,0,0,1,140,40ZM252,88a12,12,0,0,1-12,12h-4v4a12,12,0,0,1-24,0v-4h-4a12,12,0,0,1,0-24h4V72a12,12,0,0,1,24,0v4h4A12,12,0,0,1,252,88Z\"/>","plus":"<path d=\"M228,128a12,12,0,0,1-12,12H140v76a12,12,0,0,1-24,0V140H40a12,12,0,0,1,0-24h76V40a12,12,0,0,1,24,0v76h76A12,12,0,0,1,228,128Z\"/>"};
const OPEN_DONE = new Set(["Fixed", "Won't fix", "Duplicate"]);
const KIND_TABS = [["all", "All"], ["Bug", "Bugs"], ["Feedback", "Feedback"], ["Feature request", "Feature requests"]];
const SRC_ICON = { "Reddit": "reddit-logo", "Steam forum": "steam-logo", "Steam review": "steam-logo", "Discord": "chat-circle-text" };
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = (u) => /^https?:\/\//i.test(u || "") ? u : (/^shots\/[\w.\-]+$/.test(u || "") ? u : "");
const ic = (n, s = 16) => ICON[n] ? `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">${ICON[n]}</svg>` : "";
function paintIcons(root = document) { root.querySelectorAll("[data-ic]").forEach((el) => { el.outerHTML = ic(el.dataset.ic, +el.dataset.s || 16); }); }
const store = { get(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

const S = { entries: [], db: false, statuses: [], kinds: [], sources: [], kind: "all", status: new Set(), quick: "", q: "", sort: "posted", open: new Set(), logs: {} };
const fmt = (d) => { if (!d) return ""; const t = new Date(d.length === 10 ? d + "T12:00:00" : d); return isNaN(t) ? d : t.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }); };
const reports = (e) => 1 + (e.links || []).length;
const isOpen = (e) => !OPEN_DONE.has(e.status);
const tagCls = (s) => "s-" + String(s || "").split(/[\s']/)[0];

async function load(again = 0) {
  let d;
  try {
    const r = await fetch("/api/tracker", { cache: "no-store" });
    if (r.status === 401) { location.reload(); return; }
    d = await r.json();
  } catch (e) {
    $("#mode").textContent = "Can't reach the tracker"; $("#mode-dot").className = "pulse warn";
    $("#list").innerHTML = `<div class="empty">The tracker couldn't be loaded. Try again in a minute.</div>`;
    return;
  }
  Object.assign(S, { entries: d.entries || [], db: !!d.db, statuses: d.statuses || [], kinds: d.kinds || [], sources: d.sources || [] });
  $("#mode").textContent = S.db ? (d.pending ? `Importing, ${d.pending} left…` : "Live, saves for everyone") : "Read-only";
  $("#mode-dot").className = "pulse " + (S.db ? "ok" : "warn");
  const b = $("#banner");
  if (!S.db) { b.hidden = false; b.innerHTML = `${ic("warning")}<div><b>Saving is not switched on yet.</b> Entries added in Claude chat show here, but edits on this page can't be saved until the tracker database is connected to the site.</div>`; }
  else b.hidden = true;
  $("#add").disabled = !S.db;
  render();
  if (d.pending && again < 60) setTimeout(() => load(again + 1), 1200);
}

function filtered() {
  const q = S.q.trim().toLowerCase();
  const since = Date.now() - 30 * 864e5;
  let xs = S.entries.filter((e) => (S.kind === "all" || e.kind === S.kind)
    && (!S.status.size || S.status.has(e.status))
    && (!q || [e.title, e.summary, e.notes, e.jira_key, e.source, e.added_by, "#" + e.n].join(" ").toLowerCase().includes(q)));
  if (S.quick === "bugs") xs = xs.filter((e) => e.kind === "Bug" && isOpen(e));
  if (S.quick === "noticket") xs = xs.filter((e) => isOpen(e) && !e.jira_url);
  if (S.quick === "ticketed") xs = xs.filter((e) => isOpen(e) && e.jira_url);
  if (S.quick === "fixed") xs = xs.filter((e) => e.status === "Fixed" && Date.parse(e.updated_at) >= since);
  const key = { posted: (e) => e.posted_at || e.added_at || "", changed: (e) => e.updated_at || "", reports: (e) => String(reports(e)).padStart(5, "0") + (e.posted_at || "") }[S.sort];
  return xs.sort((a, b) => key(b).localeCompare(key(a)) || (b.n - a.n));
}

function render() {
  const all = S.entries, since = Date.now() - 30 * 864e5;
  $("#h-bugs").textContent = all.filter((e) => e.kind === "Bug" && isOpen(e)).length;
  $("#h-noticket").textContent = all.filter((e) => isOpen(e) && !e.jira_url).length;
  $("#h-ticketed").textContent = all.filter((e) => isOpen(e) && e.jira_url).length;
  $("#h-fixed").textContent = all.filter((e) => e.status === "Fixed" && Date.parse(e.updated_at) >= since).length;
  document.querySelectorAll(".cell").forEach((c) => c.setAttribute("aria-pressed", c.dataset.q === S.quick));
  $("#kinds").innerHTML = KIND_TABS.map(([k, label]) => `<button class="tab" role="tab" data-kind="${esc(k)}" aria-selected="${S.kind === k}">${esc(label)}<span class="n">${k === "all" ? all.length : all.filter((e) => e.kind === k).length}</span></button>`).join("");
  $("#statuses").innerHTML = S.statuses.map((s) => `<button class="chipbtn" data-status="${esc(s)}" aria-pressed="${S.status.has(s)}">${esc(s)}<span class="n">${all.filter((e) => e.status === s).length}</span></button>`).join("");
  const xs = filtered();
  $("#list").innerHTML = xs.length ? xs.map(card).join("") : `<div class="empty">${all.length ? "Nothing matches these filters." : "No entries yet. Add one here, or tell Claude in the project chat: paste a link, a screenshot or a few words."}</div>`;
  highlight();
}

function card(e) {
  const kindCls = e.kind === "Bug" ? "k-Bug" : e.kind === "Feature request" ? "k-Feature" : "";
  const url = safeUrl(e.url), jira = safeUrl(e.jira_url);
  const links = (e.links || []).map(safeUrl).filter(Boolean);
  const shots = (e.shots || []).map(safeUrl).filter(Boolean);
  const log = S.logs[e.id];
  return `<article class="card ${e.kind === "Bug" ? "k-Bug" : ""} ${isOpen(e) ? "" : "closed"}" id="${esc(e.id)}">
    <div class="top"><span class="num">#${esc(e.n)}</span><span class="tag ${kindCls}">${esc(e.kind)}</span><span class="tag ${tagCls(e.status)}">${esc(e.status)}</span>
      ${e.source ? `<span class="tag">${ic(SRC_ICON[e.source] || "tag", 14)}${esc(e.source)}</span>` : ""}
      ${jira ? `<a class="tag jira" href="${esc(jira)}" target="_blank" rel="noopener">${esc(e.jira_key || "Jira")}${e.jira_status ? " · " + esc(e.jira_status) : ""}${ic("arrow-square-out", 13)}</a>` : ""}
      ${reports(e) > 1 ? `<span class="tag">${reports(e)} reports</span>` : ""}
      <span class="when">${e.posted_at ? "Posted " + esc(fmt(e.posted_at)) : "Added " + esc(fmt(e.added_at))}</span></div>
    <div class="title">${url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(e.title)}${ic("arrow-square-out", 14)}</a>` : esc(e.title)}</div>
    ${e.summary ? `<div class="ptxt">${esc(e.summary)}</div>` : ""}
    ${e.notes ? `<div class="notes"><span class="lbl">Team notes</span>${esc(e.notes)}</div>` : ""}
    ${links.length ? `<div class="links">${links.map((l, i) => `<a class="tag" href="${esc(l)}" target="_blank" rel="noopener">Report ${i + 2}${ic("arrow-square-out", 13)}</a>`).join("")}</div>` : ""}
    ${shots.length ? `<div class="shots">${shots.map((s) => `<a href="${esc(s)}" target="_blank" rel="noopener"><img src="${esc(s)}" alt="Screenshot" loading="lazy"></a>`).join("")}</div>` : ""}
    ${log ? `<div class="log">${log.length ? log.map((l) => `<div>${esc(fmt(l.at))} · <b>${esc(l.by || "Someone")}</b> changed ${esc(l.field.replace("_", " "))}${l.field === "status" ? ` to <b>${esc(JSON.parse(l.new || '""'))}</b>` : ""}</div>`).join("") : "No changes since it was added."}</div>` : ""}
    <div class="foot"><span>Added ${esc(fmt(e.added_at))}${e.added_by ? " by " + esc(e.added_by) : ""}${e.updated_by && e.updated_at !== e.added_at ? ` · changed ${esc(fmt(e.updated_at))} by ${esc(e.updated_by)}` : ""}${e.slack && e.slack.startsWith("sent") ? " · posted to Slack" : ""}</span>
      <span class="acts">${S.db ? `<button class="btn sm ghost" data-log="${esc(e.id)}">${log ? "Hide history" : "History"}</button><button class="btn sm" data-edit="${esc(e.id)}">Edit</button>` : ""}</span></div>
  </article>`;
}

function highlight() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (!id) return;
  const el = document.getElementById(id);
  if (el && !el.classList.contains("hl")) { el.classList.add("hl"); el.scrollIntoView({ block: "start" }); }
}

// ---- add / edit ----
let editing = null, fKind = "Bug", fSource = "", fStatus = "New";
function chips(el, values, current, attr) { el.innerHTML = values.map((v) => `<button type="button" class="chipbtn" data-${attr}="${esc(v)}" aria-pressed="${v === current}">${esc(v)}</button>`).join(""); }
function openSheet(e) {
  editing = e || null;
  const f = $("#form");
  $("#sheet-title").textContent = e ? `Edit #${e.n}` : "Add entry";
  fKind = e?.kind || "Bug"; fSource = e?.source || ""; fStatus = e?.status || "New";
  chips($("#f-kind"), S.kinds, fKind, "fkind");
  chips($("#f-source"), S.sources, fSource, "fsource");
  chips($("#f-status"), S.statuses, fStatus, "fstatus");
  for (const k of ["title", "url", "jira_url", "summary", "notes"]) f.elements[k].value = e?.[k] || "";
  f.elements.posted_at.value = (e?.posted_at || "").slice(0, 10);
  f.elements.links.value = (e?.links || []).join("\n");
  f.elements.shots.value = (e?.shots || []).join("\n");
  f.elements.by.value = store.get("trk_name");
  $("#f-err").hidden = true;
  $("#sheet").showModal();
}
async function save(ev) {
  ev.preventDefault();
  const f = $("#form"), err = $("#f-err");
  const lines = (v) => v.split(/\s*\n\s*/).map((x) => x.trim()).filter(Boolean);
  const by = f.elements.by.value.trim();
  if (!by) { err.textContent = "Add your name so the team can see who changed what."; err.hidden = false; return; }
  store.set("trk_name", by);
  const data = { kind: fKind, source: fSource, status: fStatus, title: f.elements.title.value, url: f.elements.url.value, posted_at: f.elements.posted_at.value,
    jira_url: f.elements.jira_url.value, summary: f.elements.summary.value, notes: f.elements.notes.value, links: lines(f.elements.links.value), shots: lines(f.elements.shots.value) };
  if (data.jira_url && fStatus === "New" || data.jira_url && fStatus === "Needs ticket") data.status = "Ticketed";
  $("#save").disabled = true;
  try {
    const r = await fetch("/api/tracker", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify(editing ? { action: "update", id: editing.id, set: data, by } : { action: "add", entry: data, by }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Not saved");
    const i = S.entries.findIndex((x) => x.id === d.entry.id);
    if (i >= 0) S.entries[i] = d.entry; else S.entries.unshift(d.entry);
    delete S.logs[d.entry.id];
    $("#sheet").close();
    toast(editing ? "Saved" : `Added #${d.entry.n}` + (d.entry.slack?.startsWith("sent") ? ", posted to Slack" : ""));
    render();
  } catch (e) { err.textContent = e.message; err.hidden = false; }
  finally { $("#save").disabled = false; }
}
function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), 2600); }

function csv() {
  const cols = ["n", "kind", "status", "title", "url", "posted_at", "source", "jira_key", "jira_url", "jira_status", "summary", "notes", "links", "added_at", "added_by", "updated_at", "updated_by"];
  const cell = (v) => { v = Array.isArray(v) ? v.join(" ") : String(v ?? ""); return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  const body = [cols.join(","), ...filtered().map((e) => cols.map((c) => cell(e[c])).join(","))].join("\n");
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(new Blob(["﻿" + body], { type: "text/csv" })), download: `feedback-tracker-${new Date().toISOString().slice(0, 10)}.csv` });
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

document.addEventListener("click", async (ev) => {
  const t = ev.target.closest("button"); if (!t) return;
  if (t.dataset.kind) { S.kind = t.dataset.kind; render(); }
  else if (t.dataset.status) { S.status.has(t.dataset.status) ? S.status.delete(t.dataset.status) : S.status.add(t.dataset.status); render(); }
  else if (t.dataset.q) { S.quick = S.quick === t.dataset.q ? "" : t.dataset.q; render(); }
  else if (t.dataset.sort) { S.sort = t.dataset.sort; document.querySelectorAll("#sort .chipbtn").forEach((b) => b.setAttribute("aria-pressed", b === t)); render(); }
  else if (t.dataset.edit) openSheet(S.entries.find((e) => e.id === t.dataset.edit));
  else if (t.dataset.log) {
    const id = t.dataset.log;
    if (S.logs[id]) delete S.logs[id];
    else { try { S.logs[id] = (await (await fetch("/api/tracker?log=" + encodeURIComponent(id), { cache: "no-store" })).json()).log || []; } catch { S.logs[id] = []; } }
    render();
  }
  else if (t.dataset.fkind) { fKind = t.dataset.fkind; chips($("#f-kind"), S.kinds, fKind, "fkind"); }
  else if (t.dataset.fsource) { fSource = fSource === t.dataset.fsource ? "" : t.dataset.fsource; chips($("#f-source"), S.sources, fSource, "fsource"); }
  else if (t.dataset.fstatus) { fStatus = t.dataset.fstatus; chips($("#f-status"), S.statuses, fStatus, "fstatus"); }
});
$("#add").onclick = () => openSheet(null);
$("#close").onclick = $("#cancel").onclick = () => $("#sheet").close();
$("#form").onsubmit = save;
$("#csv").onclick = csv;
$("#q").oninput = (e) => { S.q = e.target.value; render(); };
window.addEventListener("hashchange", highlight);
paintIcons();
load();
</script>
