<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Feedback tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tomorrow:wght@500;600;700&family=Play:wght@400;700&display=swap">
<style>
/* Same visual language as the team Inbox and Trends pages: night-blue tonal surfaces, one teal accent, Tomorrow for headings and single figures, Play for everything else. Dark only. */
:root{--teal:#47d8d7;--teal-ink:#5fe1e0;--teal-wash:#0b2a33;--on-teal:#083d3d;--up:#5fd197;--down:#ff8f7e;--warn:#f2c14e;
  --ground:#070b15;--tray:#0a0f1d;--surface:#0d1322;--surface-2:#111a2d;--fill:#172036;--fill-hover:#1f2a45;--line:#26324f;--line-strong:#5a6a94;--ink:#eef2fb;--muted:#9ba6c2;
  --font-sans:"Play",ui-sans-serif,system-ui,sans-serif;--font-display:"Tomorrow",ui-sans-serif,system-ui,sans-serif;
  --shadow-control:0 1px 2px rgb(0 0 0/.4),0 2px 6px -2px rgb(0 0 0/.6),inset 0 0 0 1px var(--line-strong);--ease:cubic-bezier(.23,1,.32,1);color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--ground)}
body{background:var(--ground);color:var(--ink);font:15px/1.4 var(--font-sans);margin:0;padding:28px 24px 48px;min-height:100%;caret-color:var(--teal);-webkit-font-smoothing:antialiased;scrollbar-color:var(--fill-hover) transparent}
::selection{background:rgb(71 216 215/.32)}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.ic{flex:none;display:inline-block;vertical-align:middle}
.wrap{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
.lbl{font-size:13px;font-weight:700;color:var(--muted)}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 16px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:44px;height:44px;border-radius:13px;background:var(--teal);color:var(--on-teal);display:grid;place-items:center;flex:none}
h1{font:700 18px/1.2 var(--font-display);margin:0}
h2{font:700 17px/1.2 var(--font-display);margin:0}
.bsub{font-size:13px;color:var(--muted)}
.hright{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:4px 6px}
.qlink{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 8px;color:var(--teal-ink);font-weight:700;font-size:14px;text-decoration:none;background:none;border:0;cursor:pointer;font-family:var(--font-sans)}
.qlink.here{color:var(--ink);cursor:default}
.mode{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);padding:0 8px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--line-strong);flex:none}
.pulse.ok{background:var(--teal)}
.pulse.warn{background:var(--down)}
.hud{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.cell{background:var(--surface-2);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0;border:0;color:inherit;text-align:left;font:inherit;cursor:pointer;transition:background-color 150ms ease}
.cell[aria-pressed="true"]{box-shadow:inset 0 0 0 1px var(--teal-ink)}
.big{font:700 26px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.sub{font-size:13px;color:var(--muted)}
.cyan{color:var(--teal-ink)}.pos{color:var(--up)}.neg{color:var(--down)}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border-radius:16px;padding:12px 16px;color:var(--muted);font-size:14px}
.banner b{color:var(--ink)}
.banner .ic{color:var(--down);margin-top:2px}
.navrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--tray);border-radius:15px;padding:4px;min-width:460px}
.tab{height:44px;min-width:0;padding:0 14px;border:0;border-radius:11px;background:transparent;color:var(--muted);font:14px var(--font-sans);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:background-color 380ms var(--ease),color 150ms ease,scale 150ms var(--ease)}
.tab[aria-selected="true"]{background:var(--fill-hover);box-shadow:var(--shadow-control);color:var(--ink);font-weight:700}
.tab:active{scale:.97}
.tab .n{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}
.tab[aria-selected="true"] .n{color:var(--teal-ink)}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border:0;border-radius:12px;background:var(--fill);color:var(--ink);font:700 14px var(--font-sans);cursor:pointer;text-decoration:none;white-space:nowrap;transition:background-color 150ms ease,scale 150ms var(--ease)}
.btn .ic{color:var(--teal-ink)}
.btn:active{scale:.97}
.btn.sm{height:36px;padding:0 12px;border-radius:10px}
.btn.ghost{background:transparent;color:var(--teal-ink);padding:0 8px}
.btn.primary{background:var(--teal);color:var(--on-teal)}
.btn.primary .ic{color:var(--on-teal)}
.btn:disabled{opacity:.6;cursor:default}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:12px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.search .ic{color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:15px var(--font-sans);outline:0}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{height:32px;padding:0 12px;border-radius:9px;border:0;background:var(--fill);color:var(--muted);font:700 14px var(--font-sans);cursor:pointer;transition:background-color 150ms ease;display:inline-flex;align-items:center;gap:6px}
.chipbtn[aria-pressed="true"]{background:var(--fill-hover);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-strong)}
.chipbtn .n{font-variant-numeric:tabular-nums;color:var(--muted)}
.seg{display:inline-flex;background:var(--tray);border-radius:12px;padding:3px;gap:2px}
.seg .chipbtn{height:34px;background:transparent}
.seg .chipbtn[aria-pressed="true"]{background:var(--fill-hover)}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0;scroll-margin-top:20px}
.card.k-Bug{box-shadow:inset 4px 0 0 var(--down)}
.card.closed{opacity:.62}
.card.hl{border-color:var(--teal-ink)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:13px;font-weight:700;background:var(--fill);color:var(--muted);white-space:nowrap;text-decoration:none}
.tag.k-Bug{background:color-mix(in srgb,var(--down) 16%,var(--surface));color:var(--down)}
.tag.jira{color:var(--ink);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-strong)}
a.tag.jira:hover{background:var(--fill-hover)}
.num{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.when{color:var(--muted);font-size:13px;margin-left:auto;font-variant-numeric:tabular-nums}
.title{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.title a{color:var(--ink);text-decoration:none}
.title a .ic{color:var(--muted);margin-left:4px}
.ptxt{color:var(--muted);font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.notes{background:var(--surface-2);border-radius:12px;padding:10px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.notes .lbl{display:block;margin-bottom:2px}
.links{display:flex;flex-wrap:wrap;gap:6px}
.shots{display:flex;flex-wrap:wrap;gap:8px}
.shots a{display:block;width:120px;height:76px;border-radius:9px;overflow:hidden;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.shots img{width:100%;height:100%;object-fit:cover;display:block}
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:13px;color:var(--muted)}
.foot .acts{margin-left:auto}
.log{background:var(--surface-2);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--muted);display:grid;gap:4px}
.log b{color:var(--ink)}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px;color:var(--muted);text-align:center}
/* add / edit sheet */
dialog{border:0;padding:0;background:transparent;color:var(--ink);max-width:640px;width:calc(100% - 32px)}
dialog::backdrop{background:rgb(3 6 12/.72)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;display:grid;gap:14px;max-height:calc(100vh - 48px);overflow:auto}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.field{display:grid;gap:6px}
.field input,.field textarea{width:100%;min-height:44px;border-radius:12px;border:0;box-shadow:inset 0 0 0 1px var(--line-strong);background:var(--surface-2);color:var(--ink);padding:10px 14px;font:15px var(--font-sans)}
.field textarea{min-height:88px;resize:vertical;line-height:1.4}
.field .hint{font-size:13px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--down);font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;translate:-50% 0;background:var(--fill-hover);box-shadow:var(--shadow-control);border-radius:12px;padding:10px 16px;font-size:14px;z-index:5}
.tag.p6,.tag.p5{background:color-mix(in srgb,var(--down) 16%,var(--surface));color:var(--down)}
.tag.p4{color:var(--ink)}
.tag.done{background:color-mix(in srgb,var(--up) 14%,var(--surface));color:var(--up)}
.tag.lbl-t{background:var(--surface-2);color:var(--muted);font-weight:400}
.where{font-size:13px;color:var(--muted)}
.jtxt{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.jtxt b{color:var(--ink);font-weight:700}
.frow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.frow .lbl{min-width:52px}
.ptxt.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
/* next-step board */
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px}
.stage{--st:var(--line-strong);background:var(--surface-2);border:0;border-radius:16px;padding:12px 14px 12px;display:flex;flex-direction:column;gap:3px;min-width:0;color:inherit;text-align:left;font:inherit;cursor:pointer;box-shadow:inset 0 3px 0 var(--st);transition:background-color 150ms ease,scale 150ms var(--ease)}
.stage:active{scale:.98}
.stage[aria-pressed="true"]{background:var(--fill-hover);box-shadow:inset 0 3px 0 var(--st),inset 0 0 0 1px var(--st)}
.stage .lbl{color:var(--ink)}
.stage .sub{font-size:12px;line-height:1.3}
.st-triage{--st:var(--teal)}.st-needs-repro{--st:var(--warn)}.st-needs-ticket{--st:var(--down)}.st-with-dev{--st:#8ea2ff}
.st-fixed-tell-players{--st:var(--up)}.st-backlog{--st:#7d89a8}.st-closed{--st:var(--line)}
/* grouped one-line rows */
.group{display:grid;gap:8px}
.ghead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:0 2px}
.ghead .n{font:700 15px var(--font-display);color:var(--teal-ink);font-variant-numeric:tabular-nums}
.ghint{font-size:13px;color:var(--muted)}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.item{border-top:1px solid var(--line);scroll-margin-top:20px}
.item:first-child{border-top:0}
.item.hl{box-shadow:inset 3px 0 0 var(--teal-ink)}
.line{width:100%;display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 14px;border:0;background:transparent;color:var(--ink);font:15px var(--font-sans);text-align:left;cursor:pointer}
.item.is-open .line{background:var(--surface-2)}
.pdot{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font:700 13px var(--font-display);background:var(--fill);color:var(--muted)}
.pdot.p6{background:var(--down);color:#3b0d06}.pdot.p5{background:color-mix(in srgb,var(--down) 30%,var(--surface));color:var(--down)}
.pdot.p4{background:color-mix(in srgb,var(--warn) 22%,var(--surface));color:var(--warn)}.pdot.p3{color:var(--ink)}
.line .num{flex:none;min-width:38px}
.ktag{flex:none;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--fill);color:var(--muted)}
.ktag.bug{background:color-mix(in srgb,var(--down) 16%,var(--surface));color:var(--down)}
.ktag.fb{background:color-mix(in srgb,var(--warn) 16%,var(--surface));color:var(--warn)}
.ktag.req{background:var(--teal-wash);color:var(--teal-ink)}
.kic{display:inline-flex}.kic.bug{color:var(--down)}.kic.fb{color:var(--warn)}.kic.req{color:var(--teal-ink)}
.ltitle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.lmeta{flex:none;display:flex;align-items:center;gap:6px}
.tag.area{font-weight:400}
.tag.plat{background:var(--surface-2);font-weight:400}
.age{min-width:42px;text-align:right;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.detail{padding:12px 16px 16px 48px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2);border-top:1px solid var(--line)}
.detail .notes,.detail .log{background:var(--surface)}
.open-src{min-height:32px;padding:0;align-self:flex-start}
.qlink.inl{min-height:0;padding:0;display:inline}
.moveto{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.moveto .chipbtn{height:30px;font-size:13px}
.moveto .chipbtn[aria-pressed="true"]{color:var(--teal-ink);box-shadow:inset 0 0 0 1px var(--teal-ink)}
.merge{display:inline-flex;align-items:center;gap:4px}
.merge input{width:70px;height:36px;border-radius:10px;border:0;box-shadow:inset 0 0 0 1px var(--line-strong);background:var(--surface);color:var(--ink);padding:0 10px;font:14px var(--font-sans)}
.empty.sm{border:0;border-radius:0;padding:16px;background:transparent}
.group > .btn.sm{justify-self:start}
#more-filters{justify-self:start;margin-top:-10px}
@media (max-width:860px){
  .stages{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stage .sub{display:none}
  .line{flex-wrap:wrap;gap:6px 8px;padding:10px 12px}
  .ltitle{flex-basis:100%;order:5;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .lmeta{margin-left:auto}
  .lmeta .tag.area{display:none}
  #areas{flex-wrap:nowrap;overflow-x:auto;max-width:100%;padding-bottom:4px;scrollbar-width:none}
  #areas .chipbtn{flex:none;white-space:nowrap}
  .stages{gap:8px}.stage{padding:10px 12px}.stage .big{font-size:20px}
  .detail{padding:12px}
  .foot .acts{margin-left:0}
  .line .rdate{min-width:0}
}
/* Suggested */
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--teal);color:var(--on-teal);font:700 12px/20px var(--font-display);text-align:center}
.badge:empty{display:none}
#sugbtn[aria-pressed="true"]{background:var(--fill-hover);box-shadow:inset 0 0 0 1px var(--teal-ink)}
.sug #stages,.sug #sort,.sug #modes,.sug .frow,.sug #more-filters,.sug #extra-filters,.sug #csv{display:none!important}
.tag.match{background:var(--teal-wash);color:var(--teal-ink)}
.sstats{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.sacts{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.sacts .btn .mt{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:400;color:var(--muted)}
.imp #stages,.imp #sort,.imp #modes,.imp .frow,.imp #more-filters,.imp #extra-filters,.imp #csv,.imp .tools,.imp #kinds{display:none!important}
.imphead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:4px 0 12px}
.imphead h2{margin:0;font:700 18px var(--font-display)}
.impact{display:grid;gap:6px;padding:12px 14px;border-radius:12px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.impact .ih{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.impact .th{color:var(--teal-ink);font-weight:700;text-decoration:none}
.impact .sub{color:var(--muted);font-size:13px}
.impact .big{font-weight:800;color:var(--down);font-variant-numeric:tabular-nums}
.impact select{height:32px;max-width:100%;border-radius:8px;border:0;background:var(--fill);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);font:600 13px var(--font-sans);padding:0 8px}
.tag.pts{background:rgb(255 143 126/.14);color:var(--down)}
.thf{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 6px 0 10px;border-radius:9px;background:var(--teal-wash);color:var(--teal-ink);font-weight:700;font-size:13px}
.thf button{border:0;background:none;color:inherit;cursor:pointer;display:grid;place-items:center;width:24px;height:24px;border-radius:6px}
.reps{display:grid;gap:8px}
.rep{background:var(--surface);border-radius:12px;padding:10px 14px;display:grid;gap:4px}
.rtop{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:13px;color:var(--muted)}
.rtop .x{margin-left:auto;height:28px;padding:0 6px}
.rtxt{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.rorig{font-size:13px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;border-left:2px solid var(--line);padding-left:10px}
/* groups and the each-report view */
.dates{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.dates input{height:36px;border-radius:10px;border:0;box-shadow:inset 0 0 0 1px var(--line-strong);background:var(--surface-2);color:var(--ink);padding:0 10px;font:14px var(--font-sans);color-scheme:dark}
.tag.same{background:var(--surface-2);color:var(--muted);font-weight:400;box-shadow:inset 0 0 0 1px var(--line)}
.tag.st{background:var(--surface-2);font-weight:400}
.tag.st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--st)}
.rep.child{box-shadow:inset 3px 0 0 var(--line-strong)}
.rep.dim{opacity:.7}
.rep .racts{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.rep .racts .btn{height:30px;padding:0 10px;font-size:13px}
.rhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.rhead .sub{font-size:13px}
.line .rdate{flex:none;min-width:86px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
@media (hover:hover) and (pointer:fine){
  .tab:not([aria-selected="true"]):hover{color:var(--ink)}
  .btn:not(:disabled):not(.ghost):not(.primary):hover,.chipbtn:hover,.cell:hover{background:var(--fill-hover)}
  .btn.primary:hover{background:var(--teal-ink)}
  .btn.ghost:hover,.qlink:not(.here):hover{text-decoration:underline}
  .title a:hover{color:var(--teal-ink)}
}
@media (max-width:860px){
  body{padding:16px 16px 40px}.wrap{gap:16px}
  .hud{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tabs{min-width:0;width:100%}.tab{padding:0 6px;gap:5px}
  .tab .tl{display:none}
  .big{font-size:24px}
  .row2{grid-template-columns:1fr}
  .hright{justify-content:flex-start}
  .qlink.here{display:none}
  .frow{flex-direction:column;align-items:flex-start;gap:6px}
  .seg{max-width:100%;overflow-x:auto}
  .seg .chipbtn{white-space:nowrap}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="mark"><span data-ic="wrench" data-s="22"></span></div><div><h1>Feedback tracker</h1><div class="bsub">Player bugs, feedback and requests, with their Jira tickets</div></div></div>
    <div class="hright">
      <span class="mode"><span class="pulse" id="mode-dot"></span><span id="mode">Loading…</span></span>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <div class="stages" id="stages" role="group" aria-label="Next step"></div>

  <div class="navrow">
    <div class="tabs" role="tablist" id="kinds"></div>
    <div class="acts">
      <button class="btn" id="impbtn" aria-pressed="false" title="Which themes cost the Steam review score, and which entries cover them"><span data-ic="gauge"></span>Impact</button>

const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = (u) => /^https?:\/\//i.test(u || "") ? u : (/^shots\/[\w.\-]+$/.test(u || "") ? u : "");
const ic = (n, s = 16) => ICON[n] ? `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">${ICON[n]}</svg>` : "";
function paintIcons(root = document) { root.querySelectorAll("[data-ic]").forEach((el) => { el.outerHTML = ic(el.dataset.ic, +el.dataset.s || 16); }); }
const store = { get(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

const S = { entries: [], db: false, kinds: [], priorities: [], labels: [], sources: [], platforms: [], statuses: [], hints: {}, jiraBase: "",
  kind: "all", stage: "", area: new Set(), label: new Set(), source: new Set(), platform: new Set(), q: "", sort: "priority", open: new Set(), full: new Set(), logs: {},
  view: "board", suggestions: [], sopen: new Set(), mode: "grouped", range: "all", from: "", to: "", ropen: new Set(), byId: new Map(), kids: new Map(), M: null, td: null, gaps: false, theme: null };
const DONE = "Closed";
const fmt = (d) => { if (!d) return ""; const t = new Date(d.length === 10 ? d + "T12:00:00" : d); return isNaN(t) ? d : t.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }); };
const reports = (e) => Math.max(1 + (e.links || []).length, +(e.extra && e.extra.reports) || 0);
const prioNum = (e) => parseInt(e.priority, 10) || 0;
const jiraHref = (e) => safeUrl(e.jira_url) || (S.jiraBase && e.jira_key ? `${S.jiraBase}/browse/${e.jira_key}` : "");
const fullText = (e) => e.summary || e.title;
const rest = (e) => { const s = (e.summary || "").trim().replace(/\s+/g, " "), t = (e.title || "").replace(/…$/, ""); return s.startsWith(t) ? s.slice(t.length).trim() : s; };
const areaOf = (e) => e.area || (AREAS.find(([, re]) => re.test(`${e.title} ${e.summary} ${e.jira}`)) || ["Other"])[0];
const ageDays = (e) => { const t = Date.parse((e.posted_at || e.added_at || "").slice(0, 10) + "T12:00:00Z"); return isNaN(t) ? null : Math.max(0, Math.floor((Date.now() - t) / 864e5)); };
const KIND_TAG = { Bug: ["bug", "bug-beetle", "Bug"], Feedback: ["fb", "lightbulb", "FB"], Request: ["req", "sparkle", "Req"] };
const ktag = (k) => { const [c, i, t] = KIND_TAG[k] || KIND_TAG.Feedback; return `<span class="ktag ${c}">${ic(i, 13)}${t}</span>`; };
const stageKey = (s) => "st-" + String(s).replace(/[^a-z]+/gi, "-").toLowerCase();

// ---- groups: one entry per report, children point at the group's first entry with dup_of ----
function indexGroups() {
  S.byId = new Map(S.entries.map((e) => [e.id, e]));
  S.kids = new Map();
  for (const e of S.entries) if (isChild(e)) { if (!S.kids.has(e.dup_of)) S.kids.set(e.dup_of, []); S.kids.get(e.dup_of).push(e); }
}
const isChild = (e) => !!(e.dup_of && e.dup_of !== e.id && S.byId.has(e.dup_of));
const rootOf = (e) => (isChild(e) ? S.byId.get(e.dup_of) : e);
const members = (e) => [e, ...(S.kids.get(e.id) || [])];
const same = (m, root) => m !== root && !!(m.extra && m.extra.same);
const day = (d) => String(d || "").slice(0, 10);
// Discord message ids carry their timestamp, so a bare Discord link still has a date
const snowDate = (u) => { const m = String(u || "").match(/discord\.com\/channels\/\d+\/\d+\/(\d{17,20})/); return m ? new Date(Number(BigInt(m[1]) >> 22n) + 1420070400000).toISOString().slice(0, 10) : ""; };
const srcOfUrl = (u) => /discord\.com/.test(u) ? "Discord" : /reddit\.com/.test(u) ? "Reddit" : /steamcommunity\.com\/.*recommended/.test(u) ? "Steam review" : /steamcommunity\.com/.test(u) ? "Steam forum" : "";
// The reports one entry holds: its own post, extra reports folded into it (extra.more), and bare extra links.
function ownReports(e) {
  const out = [{ e, k: e.id + ":0", main: true, d: day(e.posted_at) || snowDate(e.url), t: fullText(e), u: safeUrl(e.url), src: e.source }];
  for (const [i, m] of ((e.extra && e.extra.more) || []).entries()) out.push({ e, k: `${e.id}:m${i}`, d: day(m.d) || snowDate(m.u), t: m.t, o: m.o, u: safeUrl(m.u), src: m.src || srcOfUrl(m.u || ""), lang: m.lang, rsame: !!m.same });
  const seen = new Set(out.map((r) => r.u).filter(Boolean));
  for (const [i, l] of (e.links || []).entries()) {
    const u = safeUrl(l); if (!u || seen.has(u)) continue; seen.add(u);
    out.push({ e, k: `${e.id}:l${i}`, d: snowDate(u), t: "", u, src: srcOfUrl(u) });
  }
  const left = reports(e) - out.length;
  if (left > 0) out.push({ e, k: e.id + ":x", d: "", t: "", n: left, src: "" });
  return out;
}
function groupReports(root) {
  if (!groupReports.c.has(root.id)) groupReports.c.set(root.id, members(root).flatMap((m) => ownReports(m).map((r) => ({ ...r, root, same: same(m, root) || !!r.rsame }))));
  return groupReports.c.get(root.id);
}
groupReports.c = new Map();
// "Single report" / "Multiple reports" follow the group's real count, whatever the stored label says
const COUNT_TAGS = ["Single report", "Multiple reports"];
const shownTags = (e) => { const t = (e.tags || []).filter((x) => !COUNT_TAGS.includes(x)), had = (e.tags || []).some((x) => COUNT_TAGS.includes(x)), n = counted(groupReports(e));
  return n > 1 ? [...t, "Multiple reports"] : had ? [...t, "Single report"] : t; };
const counted = (rs) => rs.reduce((n, r) => n + (r.same ? 0 : r.n || 1), 0);
const rangeOn = () => !!(S.from || S.to);
const inRange = (d) => !rangeOn() || (!!d && (!S.from || d >= S.from) && (!S.to || d <= S.to));
const groupCount = (root) => counted(groupReports(root).filter((r) => inRange(r.d)));
const lastDate = (root) => groupReports(root).map((r) => r.d).filter(inRange).sort().pop() || "";
const RANGES = [["all", "All time"], ["7", "7 days"], ["30", "30 days"], ["90", "90 days"], ["custom", "Custom"]];
function setRange(v) {
  S.range = v;
  if (v === "all") S.from = S.to = "";
  else if (v !== "custom") { S.from = new Date(Date.now() - (+v - 1) * 864e5).toISOString().slice(0, 10); S.to = ""; }
  else { S.from = $("#from").value; S.to = $("#to").value; }
}

async function load(again = 0) {
  let d;
  try {
    const r = await fetch("/api/tracker", { cache: "no-store" });
    if (r.status === 401) { location.reload(); return; }
    d = await r.json();
  } catch (e) {
    $("#mode").textContent = "Can't reach the tracker"; $("#mode-dot").className = "pulse warn";
    $("#list").innerHTML = `<div class="empty">The tracker couldn't be loaded. Try again in a minute.</div>`;
    return;
  }
  Object.assign(S, { entries: d.entries || [], db: !!d.db, kinds: d.kinds || [], priorities: d.priorities || [], labels: d.labels || [],
    sources: d.sources || [], platforms: d.platforms || [], statuses: d.statuses || [], hints: d.stage_hints || {}, jiraBase: d.jira_base || "", suggestions: d.suggestions || [] });
  $("#mode").textContent = S.db ? (d.pending ? `Importing, ${d.pending} left…` : "Live, saves for everyone") : "Read-only";
  $("#mode-dot").className = "pulse " + (S.db ? "ok" : "warn");
  const b = $("#banner");
  b.hidden = S.db;
  if (!S.db) b.innerHTML = `${ic("warning")}<div><b>Saving is not switched on here.</b> Entries show, but changes on this page can't be saved until the tracker database is connected to this site.</div>`;
  $("#add").disabled = !S.db;
  indexGroups(); groupReports.c.clear(); relink();
  render();
  if (d.pending && again < 60) setTimeout(() => load(again + 1), 1200);
  else if (S.td === null) loadTrends();
  else hashActions();
}
// Trends' data file links each entry to its theme's negative reviews (TrackerLinks, shared with Trends and the Inbox)
async function loadTrends() {
  S.td = undefined;
  try { const r = await fetch("/trends/trends_data.json"); if (!r.ok) throw 0; S.td = await r.json(); } catch { S.td = false; }
  relink(); render(); hashActions();
}
// (the theme guess uses the area someone picked, not the tracker's own area guess, so Trends and the Inbox file entries the same way)
function relink() { if (S.td && window.TrackerLinks) S.M = TrackerLinks.build(S.td, S.entries); }
const impOf = (e) => (S.M && S.M.entry.get(e.id)) || null;

function matches(e, skip) {
  const q = S.q.trim().toLowerCase();
  return (S.kind === "all" || e.kind === S.kind)
    && (skip === "area" || !S.area.size || S.area.has(areaOf(e)))
    && (!S.label.size || shownTags(e).some((t) => S.label.has(t)))
    && (!S.source.size || S.source.has(e.source || "Unknown"))
    && (!S.platform.size || (e.platforms || []).some((p) => S.platform.has(p)))
    && (!q || members(e).some((m) => hay(m).includes(q)))
    && (!rangeOn() || groupReports(e).some((r) => inRange(r.d)))
    && (S.theme == null || (impOf(e)?.th || []).includes(S.theme));
}
const hay = (e) => [e.title, e.summary, e.notes, e.jira, e.jira_key, e.where, e.source, e.added_by, areaOf(e), "#" + e.n, ...(e.tags || []), ...(e.platforms || []),
  ...((e.extra && e.extra.more) || []).flatMap((m) => [m.t, m.o])].join(" ").toLowerCase();
function sorted(xs) {
  const posted = (e) => e.posted_at || (e.added_at || "").slice(0, 10);
  const cmp = {
    priority: (a, b) => prioNum(b) - prioNum(a) || groupCount(b) - groupCount(a) || lastDate(b).localeCompare(lastDate(a)),
    reports: (a, b) => groupCount(b) - groupCount(a) || prioNum(b) - prioNum(a),
    impact: (a, b) => (impOf(b)?.cost || 0) - (impOf(a)?.cost || 0) || groupCount(b) - groupCount(a) || prioNum(b) - prioNum(a),
    posted: (a, b) => lastDate(b).localeCompare(lastDate(a)) || posted(b).localeCompare(posted(a)),
    changed: (a, b) => (b.updated_at || "").localeCompare(a.updated_at || ""),
  }[S.sort];
  return xs.sort((a, b) => cmp(a, b) || b.n - a.n);
}
function chipRow(el, values, set, attr, count) {
  el.innerHTML = values.map((v) => `<button class="chipbtn" data-${attr}="${esc(v)}" aria-pressed="${set.has(v)}">${esc(v)}<span class="n">${count(v)}</span></button>`).join("");
}

function kindTabs(xs) {
  $("#kinds").innerHTML = [["all", "All"], ["Bug", "Bugs"], ["Feedback", "Feedback"], ["Request", "Requests"]].map(([k, label]) =>
    `<button class="tab" role="tab" data-kind="${esc(k)}" aria-label="${esc(label)}" aria-selected="${S.kind === k}">${KIND_TAG[k] ? `<span class="kic ${KIND_TAG[k][0]}">${ic(KIND_TAG[k][1], 15)}</span>` : ""}<span class="${KIND_TAG[k] ? "tl" : ""}">${esc(label)}</span><span class="n">${xs.filter((e) => k === "all" || e.kind === k).length}</span></button>`).join("");
}
function render() {
  const sug = S.view === "suggest", imp = S.view === "impact";
  document.body.classList.toggle("sug", sug);
  document.body.classList.toggle("imp", imp);
  $("#sugbtn").setAttribute("aria-pressed", sug);
  $("#impbtn").setAttribute("aria-pressed", imp);
  $("#sugn").textContent = S.suggestions.length || "";
  $("#thchip").innerHTML = S.theme != null && S.M ? `<span class="thf">Theme: ${esc(S.M.R[S.theme].name)}<button data-thclear="1" aria-label="Show all themes">${ic("x", 14)}</button></span>` : "";
  if (sug) return renderSuggest();
  if (imp) return renderImpact();
  const each = S.mode === "each";
  document.querySelectorAll("#modes .chipbtn").forEach((b) => b.setAttribute("aria-pressed", b.dataset.mode === S.mode));
  const sorts = each ? [["new", "Newest"], ["old", "Oldest"]] : [["priority", "Priority"], ["impact", "Impact"], ["reports", "Reports"], ["posted", "Newest"], ["changed", "Changed"]];
  if (!sorts.some(([k]) => k === S.sort)) S.sort = sorts[0][0];
  $("#sort").innerHTML = sorts.map(([k, l]) => `<button class="chipbtn" data-sort="${k}" aria-pressed="${S.sort === k}">${l}</button>`).join("");
  $("#ranges").innerHTML = RANGES.map(([k, l]) => `<button class="chipbtn" data-range="${k}" aria-pressed="${S.range === k}">${l}</button>`).join("");
  $("#custom").hidden = S.range !== "custom";
  const all = S.entries.filter((e) => !isChild(e));
  const inView = all.filter((e) => matches(e));
  // next-step board: counts follow the type, area, label, source and search filters
  $("#stages").innerHTML = S.statuses.map((s) => {
    const xs = inView.filter((e) => e.status === s), hi = xs.filter((e) => prioNum(e) >= 5).length;
    return `<button class="stage ${stageKey(s)}" data-stage="${esc(s)}" aria-pressed="${S.stage === s}">
      <span class="lbl">${esc(s)}</span><span class="big">${xs.length}</span>
      <span class="sub">${hi ? `<b class="neg">${hi} very high+</b> · ` : ""}${esc(S.hints[s] || "")}</span></button>`;
  }).join("");
  const scope = all.filter((e) => (!S.stage ? e.status !== DONE : e.status === S.stage));
  kindTabs(scope);
  const areaScope = scope.filter((e) => matches(e, "area"));
  chipRow($("#areas"), AREA_NAMES.filter((a) => areaScope.some((e) => areaOf(e) === a) || S.area.has(a)), S.area, "area", (v) => areaScope.filter((e) => areaOf(e) === v).length);
  const sc2 = scope.filter((e) => S.kind === "all" || e.kind === S.kind);
  chipRow($("#labels"), S.labels, S.label, "label", (v) => sc2.filter((e) => shownTags(e).includes(v)).length);
  const srcs = [...S.sources, ...(sc2.some((e) => !e.source) ? ["Unknown"] : [])];
  chipRow($("#sources"), srcs.filter((v) => sc2.some((e) => (e.source || "Unknown") === v) || S.source.has(v)), S.source, "source", (v) => sc2.filter((e) => (e.source || "Unknown") === v).length);
  chipRow($("#platforms"), S.platforms.filter((v) => sc2.some((e) => (e.platforms || []).includes(v)) || S.platform.has(v)), S.platform, "platform", (v) => sc2.filter((e) => (e.platforms || []).includes(v)).length);
  const nf = S.label.size + S.source.size + S.platform.size;
  $("#more-filters").textContent = nf ? `More filters (${nf} on)` : "More filters";

  if (each) return renderEach(scope);
  // one group per next step (or just the chosen one)
  const groups = (S.stage ? [S.stage] : S.statuses.filter((s) => s !== DONE)).map((s) => [s, sorted(inView.filter((e) => e.status === s))]);
  const html = groups.filter(([, xs]) => xs.length || S.stage).map(([s, xs]) => {
    const cap = S.stage || S.full.has(s) || S.q ? xs.length : GROUP_ROWS;
    return `<section class="group">
      <div class="ghead"><h2>${esc(s)}</h2><span class="n">${xs.length}</span><span class="ghint">${esc(S.hints[s] || "")}</span></div>
      <div class="rows">${xs.slice(0, cap).map(row).join("") || `<div class="empty sm">Nothing here with these filters.</div>`}</div>
      ${xs.length > cap ? `<button class="btn ghost sm" data-full="${esc(s)}">Show all ${xs.length}</button>` : ""}
    </section>`;
  }).join("");
  $("#list").innerHTML = html || `<div class="empty">${all.length ? "Nothing matches these filters." : "No entries yet. Add one here, or tell Claude in the project chat: paste a link, a screenshot or a few words."}</div>`;
  highlight();
}

function row(e) {
  const p = prioNum(e), open = S.open.has(e.id), age = ageDays(e);
  return `<article class="item ${open ? "is-open" : ""}" id="${esc(e.id)}">
    <button class="line" data-toggle="${esc(e.id)}" aria-expanded="${open}">
      <span class="pdot p${p}" title="${esc(e.priority || "No priority")}">${p || "–"}</span>
      <span class="num">#${esc(e.n)}</span>

      <span class="ltitle">${esc(e.title)}</span>
      <span class="lmeta">
        <span class="tag area">${esc(areaOf(e))}</span>
        ${groupCount(e) > 1 ? `<span class="tag" title="${esc(rangeOn() ? "reports in these dates" : "reports from different players")}">×${groupCount(e)}</span>` : ""}
        ${e.jira_key ? `<span class="tag jira">${esc(e.jira_key)}</span>` : ""}
        ${S.sort === "impact" && impOf(e)?.cost >= 0.05 ? `<span class="tag pts" title="What its theme costs the 30-day review score">+${TrackerLinks.fmtPts(impOf(e).cost)} pts</span>` : ""}
        <span class="age">${age === null ? "" : age + "d"}</span>

}

    ${e.source || e.where ? `<div class="where">${ic(SRC_ICON[e.source] || "tag", 13)} ${esc([e.source, e.where].filter(Boolean).join(" · "))}</div>` : ""}
    ${jtitle ? `<div class="jtxt"><b>${esc(e.jira_key)}</b> ${esc(jtitle)}</div>` : ""}

        <button class="btn sm ghost" data-log="${esc(e.id)}">${log ? "Hide history" : "History"}</button><button class="btn sm" data-edit="${esc(e.id)}">Edit</button></span>` : ""}</div>
  </div>`;
}

// Every report in a group, newest first, each with its own date, text and link.
function reportsBlock(root) {
  const rs = groupReports(root);
  if (rs.length < 2) return "";
  const n = counted(rs), reps = rs.filter((r) => r.same).length;
  const dates = rs.map((r) => r.d).filter(Boolean).sort();
  const sorted = [...rs].sort((a, b) => (b.d || "").localeCompare(a.d || ""));
  const span = dates.length ? (dates[0] === dates[dates.length - 1] ? fmt(dates[0]) : `${fmt(dates[0])} to ${fmt(dates[dates.length - 1])}`) : "";
  return `<div class="reps">
    <div class="rhead"><span class="lbl">Reports</span><span class="sub">${n} from different players${reps ? `, ${reps} repeat${reps > 1 ? "s" : ""} by the same player` : ""}${span ? " · " + esc(span) : ""}</span></div>
    ${sorted.map((r) => repCard(r)).join("")}
  </div>`;
}
function repCard(r, inEach) {

  return `<div class="rep ${child ? "child" : ""} ${r.same ? "dim" : ""}">
    <div class="rtop">${r.src ? `<span class="tag">${esc(r.src)}</span>` : ""}${r.lang && r.lang !== "english" ? `<span>${esc(langName(r.lang))}</span>` : ""}

const LANGS = { english: "English", schinese: "Chinese", tchinese: "Chinese (Trad.)", russian: "Russian", spanish: "Spanish", latam: "Spanish (LatAm)",

  koreana: "Korean", ukrainian: "Ukrainian", italian: "Italian", thai: "Thai", czech: "Czech", vietnamese: "Vietnamese", dutch: "Dutch" };

const xLang = (x) => (x.lang ? langName(x.lang) : x.english ? "Translated" : "English");
const STOP = new Set("the and for with that this are was but not you your have has had its it's can cant can't from they them their there when what why how all any too very just more most some into out about been were will would could should after before since than then also only even still does doesn't don't didn't get got use using used game aimlabs aimlab player players user users want wants like add please update updates updated issue issues problem match matches".split(" "));

function sugGroups(xs) {

  for (const x of xs) {

    if (!by.has(k)) by.set(k, { id: x.sid, kind: x.kind, issue: x.issue, items: [] });
    by.get(k).items.push(x);

  const gs = [...by.values()];
  for (let i = 0; i < gs.length; i++) for (let j = i + 1; j < gs.length; j++) {

async function post(body) {

  const d = await r.json();
  if (!r.ok) throw new Error(d.error || "Not saved");
  if (d.done) S.suggestions = S.suggestions.filter((x) => !d.done.includes(x.sid));
  for (const x of [d.entry, d.into, ...(d.moved || [])].filter(Boolean)) {
    const i = S.entries.findIndex((y) => y.id === x.id);
    if (i >= 0) S.entries[i] = x; else S.entries.unshift(x);
    delete S.logs[x.id];
  }
  indexGroups(); groupReports.c.clear(); relink();
  return d;
}

  $("#save").disabled = true;
  try {
    const d = await post(editing ? { action: "update", id: editing.id, set: data, by } : { action: "add", entry: data, by });
    $("#sheet").close();
    S.open.add(d.entry.id);
    toast(editing ? "Saved" : `Added #${d.entry.n}` + (d.entry.slack?.startsWith("sent") ? ", posted to Slack" : ""));
    render();
  } catch (e) { err.textContent = e.message; err.hidden = false; }
  finally { $("#save").disabled = false; }
}
function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), 2600); }

function csv() {
  const cols = ["n", "group", "same_player", "reports", "kind", "status", "priority", "area", "title", "summary", "posted_at", "url", "source", "where", "platforms", "tags", "jira", "jira_url", "notes", "links", "added_by", "updated_at", "updated_by"];
  const cell = (v) => { v = Array.isArray(v) ? v.join(", ") : String(v ?? ""); return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  const xs = sorted(S.entries.filter((e) => !isChild(e) && matches(e) && (S.stage ? e.status === S.stage : true))).flatMap(members);
  const val = (e, c) => { const r = rootOf(e);
    return c === "area" ? areaOf(r) : c === "group" ? (r === e ? "" : "#" + r.n) : c === "same_player" ? (same(e, r) ? "yes" : "") : c === "reports" ? (r === e ? groupCount(e) : reports(e))
      : c === "status" ? r.status : e[c]; };
  const body = [cols.join(","), ...xs.map((e) => cols.map((c) => cell(val(e, c))).join(","))].join("\n");
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(new Blob(["﻿" + body], { type: "text/csv" })), download: `feedback-tracker-${new Date().toISOString().slice(0, 10)}.csv` });
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

const toggle = (set, v) => (set.has(v) ? set.delete(v) : set.add(v));
document.addEventListener("click", async (ev) => {
  const t = ev.target.closest("button"); if (!t) return;
  const d = t.dataset;
  if (d.toggle) { toggle(S.open, d.toggle); render(); }
  else if (d.stage !== undefined && t.classList.contains("stage")) { S.stage = S.stage === d.stage ? "" : d.stage; render(); }
  else if (d.kind) { S.kind = d.kind; render(); }
  else if (d.area) { toggle(S.area, d.area); render(); }
  else if (d.label) { toggle(S.label, d.label); render(); }
  else if (d.source) { toggle(S.source, d.source); render(); }
  else if (d.platform) { toggle(S.platform, d.platform); render(); }
  else if (d.full) { S.full.add(d.full); render(); }
  else if (d.sort) { S.sort = d.sort; render(); }
  else if (d.move) {
    const e = S.entries.find((x) => x.id === d.move);
    if (!e || e.status === d.to) return;
    const by = whoAmI(); if (!by) return;
    try { await post({ action: "update", id: e.id, set: { status: d.to }, by }); toast(`#${e.n} moved to ${d.to}`); render(); }
    catch (err) { toast(err.message); }
  }
  else if (d.merge) {
    const into = (document.querySelector(`[data-mergein="${CSS.escape(d.merge)}"]`)?.value || "").trim();
    if (!into) { toast("Type the # of the entry to group it with"); return; }
    const by = whoAmI(); if (!by) return;
    try { const r = await post({ action: "group", id: d.merge, into, by }); S.open.delete(d.merge); toast(`Grouped with #${r.into.n}`); goTo(r.into.id); }
    catch (err) { toast(err.message); }
  }
  else if (d.ungroup || d.same !== undefined) {
    const by = whoAmI(); if (!by) return;
    try {
      const r = await post(d.ungroup ? { action: "ungroup", id: d.ungroup, by } : { action: "same", id: d.same, same: !!d.v, by });
      toast(d.ungroup ? `#${r.entry.n} is its own entry again` : d.v ? "Counted as the same player" : "Counted as another player");
      if (d.ungroup) S.open.add(r.entry.id);
      render();
    } catch (err) { toast(err.message); }
  }
  else if (d.mode) { S.mode = d.mode; S.full.delete("each"); render(); }
  else if (d.range) { setRange(d.range); render(); }
  else if (d.ropen) { toggle(S.ropen, d.ropen); render(); }
  else if (d.edit) openSheet(S.entries.find((e) => e.id === d.edit));
  else if (d.log) {
    if (S.logs[d.log]) delete S.logs[d.log];
    else { try { S.logs[d.log] = (await (await fetch("/api/tracker?log=" + encodeURIComponent(d.log), { cache: "no-store" })).json()).log || []; } catch { S.logs[d.log] = []; } }
    render();
  }
  else if (d.sugtoggle) { toggle(S.sopen, d.sugtoggle); render(); }
  else if (d.sugadd) sugAct("suggest_add", S.groups.get(d.sugadd), { entry: sugEntry(S.groups.get(d.sugadd)) });
  else if (d.sugmerge) {
    const into = d.into || (document.querySelector(`[data-sugin="${CSS.escape(d.sugmerge)}"]`)?.value || "").trim();
    if (!into) { toast("Type the # of the entry to add these reports to"); return; }
    sugAct("suggest_merge", S.groups.get(d.sugmerge), { into });
  }
  else if (d.sugdismiss) sugAct("suggest_dismiss", S.groups.get(d.sugdismiss));
  else if (d.sugdrop) sugAct("suggest_dismiss", { items: [{ sid: d.sugdrop }] });
  else if (d.tlg !== undefined) { S.gaps = !!d.tlg; render(); }
  else if (d.thclear) { S.theme = null; if (location.hash.startsWith("#theme=")) history.replaceState(null, "", location.pathname); render(); }
  else if (d.fkind) { F.kind = d.fkind; paintForm(); }
  else if (d.fstatus) { F.status = d.fstatus; paintForm(); }
  else if (d.fpriority) { F.priority = d.fpriority; paintForm(); }
  else if (d.farea) { F.area = F.area === d.farea ? "" : d.farea; paintForm(); }
  else if (d.flabel) { toggle(F.tags, d.flabel); paintForm(); }
  else if (d.fplatform) { toggle(F.platforms, d.fplatform); paintForm(); }
  else if (d.fsource) { F.source = F.source === d.fsource ? "" : d.fsource; paintForm(); }
});
$("#more-filters").onclick = (ev) => { const x = $("#extra-filters"); x.hidden = !x.hidden; ev.currentTarget.setAttribute("aria-expanded", !x.hidden); };
$("#add").onclick = () => openSheet(null);
$("#impbtn").onclick = () => { S.view = S.view === "impact" ? "board" : "impact"; render(); window.scrollTo({ top: 0 }); };
document.addEventListener("change", async (ev) => {
  const sel = ev.target.closest("select[data-themefor]"); if (!sel) return;
  const by = whoAmI(); if (!by) return;
  sel.disabled = true;
  try { await post({ action: "theme", id: sel.dataset.themefor, theme: sel.value, by }); toast(sel.value ? (sel.value === "none" ? "No theme for this entry" : `Filed under ${sel.value}`) : "Theme guessed from its words again"); render(); }
  catch (err) { toast(err.message); sel.disabled = false; }
});
$("#sugbtn").onclick = () => { S.view = S.view === "suggest" ? "board" : "suggest"; S.kind = "all"; render(); window.scrollTo({ top: 0 }); };
$("#close").onclick = $("#cancel").onclick = () => $("#sheet").close();
$("#form").onsubmit = save;
$("#csv").onclick = csv;
$("#q").oninput = (e) => { S.q = e.target.value; render(); };
$("#from").onchange = $("#to").onchange = () => { setRange("custom"); render(); };
window.addEventListener("hashchange", () => { highlight.done = hashActions.done = ""; highlight(); });
paintIcons();
load();
</script>
